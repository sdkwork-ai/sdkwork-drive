[package]
rust-version.workspace = true
name = "sdkwork-drive-pc-desktop"
version = "0.1.0"
description = "SDKWork Drive PC desktop host shell."
authors = ["SDKWork"]
license = "SEE LICENSE IN LICENSE"
edition = "2021"


[lints]
workspace = true
[workspace]


[workspace.package]
edition = "2021"
rust-version = "1.85"
[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork-utils-rust = { path = "../../../../../../sdkwork-utils/packages/sdkwork-utils-rust" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "3"
open = "5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sdkwork-utils-rust.workspace = true
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
