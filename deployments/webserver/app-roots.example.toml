# Adaptive Web roots for sdkwork-drive (copy into runtime config when in-process).
# Docker entrypoint generates /etc/sdkwork/webserver/module-app-roots/sdkwork-drive.toml

[app_roots]
tablet_surface = "pc"

[app_roots.pc_static_by_environment]
development = "apps/sdkwork-drive-pc/dist/dev"
test = "apps/sdkwork-drive-pc/dist/test"
staging = "apps/sdkwork-drive-pc/dist/staging"
production = "apps/sdkwork-drive-pc/dist/prod"

[app_roots.static_fallback_by_environment]
development = "deployments/webserver/static"
test = "deployments/webserver/static"
staging = "deployments/webserver/static"
production = "deployments/webserver/static"
