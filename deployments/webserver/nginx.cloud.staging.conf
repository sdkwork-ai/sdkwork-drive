# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/drive/webserver.pid;
error_log /var/log/sdkwork/drive/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name drive-staging.sdkwork.com drive-staging.birdcoder.com drive-staging.dtupay.com drive-staging.noaper.com drive-staging.sdkwork.cn drive-staging.birdcoder.cn drive-staging.dtupay.cn drive-staging.noaper.cn drive-staging.skubc.com drive-staging.skubc.cn drive-staging.zowalk.com drive-staging.zowalk.cn drive-staging.offer86.com drive-staging.offer86.cn drive-staging.86offer.com drive-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
