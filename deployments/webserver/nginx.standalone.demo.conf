# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/drive/webserver.pid;
error_log /var/log/sdkwork/drive/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name drive-demo.sdkwork.com drive-demo.birdcoder.com drive-demo.dtupay.com drive-demo.noaper.com drive-demo.sdkwork.cn drive-demo.birdcoder.cn drive-demo.dtupay.cn drive-demo.noaper.cn drive-demo.skubc.com drive-demo.skubc.cn drive-demo.zowalk.com drive-demo.zowalk.cn drive-demo.offer86.com drive-demo.offer86.cn drive-demo.86offer.com drive-demo.86offer.cn;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            root /usr/share/sdkwork/drive/web/pc;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
