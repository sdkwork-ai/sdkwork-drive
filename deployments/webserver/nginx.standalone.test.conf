# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/drive/webserver.pid;
error_log /var/log/sdkwork/drive/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name drive-test.sdkwork.com drive-test.birdcoder.com drive-test.dtupay.com drive-test.sdkwork.cn drive-test.birdcoder.cn drive-test.dtupay.cn drive-test.skubc.com drive-test.skubc.cn drive-test.zowalk.com drive-test.zowalk.cn drive-test.offer86.com drive-test.offer86.cn drive-test.86offer.com drive-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
