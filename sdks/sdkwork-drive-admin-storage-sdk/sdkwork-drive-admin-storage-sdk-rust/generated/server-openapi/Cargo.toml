[workspace]

[package]
name = "sdkwork-drive-admin-storage-sdk-generated-rust"
version = "0.1.0"
edition = "2021"
description = "sdkwork-drive-admin-storage-sdk SDK"
license = "MIT"
authors = ["SDKWork Team"]

[lib]
name = "sdkwork_drive_admin_storage_sdk_generated_rust"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
http = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
